name: GovaApp
options:
  bundleIdPrefix: com.gova
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  GovaApp:
    type: application
    platform: iOS
    sources:
      - path: GovaApp
        excludes:
          - "**/.gitkeep"
          - "**/.DS_Store"
    info:
      path: GovaApp/Info.plist
      properties:
        CFBundleDisplayName: GovaApp
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gova.GovaApp
    scheme:
      testTargets: []

configs:
  Debug: debug
  Release: release
