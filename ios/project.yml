name: GovaApp
options:
  bundleIdPrefix: com.gova
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  GovaApp:
    type: application
    platform: iOS
    sources:
      - path: GovaApp
        excludes:
          - "**/.gitkeep"
          - "**/.DS_Store"
    info:
      path: GovaApp/Info.plist
      properties:
        CFBundleDisplayName: GovaApp
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gova.GovaApp
        # DEVELOPMENT_TEAM is written by /prep so it survives `xcodegen generate`.
        # Blank builds fine for the simulator; set it for a physical-device build.
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - GovaAppTests
        - GovaAppUITests

  GovaAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GovaAppTests
    dependencies:
      - target: GovaApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gova.GovaAppTests

  GovaAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GovaAppUITests
    dependencies:
      - target: GovaApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gova.GovaAppUITests
        TEST_TARGET_NAME: GovaApp

configs:
  Debug: debug
  Release: release
